name: QueryWatt SQL efficiency regression guard
description: Measure SQL Server queries and fail when approved efficiency thresholds regress.
author: QueryWatt contributors

branding:
  icon: activity
  color: green

inputs:
  configuration-file:
    description: Path to querywatt.yml, relative to the repository root.
    required: false
    default: querywatt.yml
  tool-version:
    description: QueryWatt NuGet tool version to install.
    required: false
    default: 0.1.0-preview.1
  package-source:
    description: NuGet source containing the QueryWatt tool package.
    required: false
    default: https://api.nuget.org/v3/index.json
  setup-dotnet:
    description: >-
      Install the .NET SDK before installing the tool. Set to "false" when the
      job already ran actions/setup-dotnet.
    required: false
    default: "true"
  dotnet-version:
    description: .NET SDK version to install when setup-dotnet is enabled.
    required: false
    default: 10.0.x
  report-file:
    description: Markdown report path, relative to the repository root.
    required: false
    default: artifacts/querywatt-report.md
  json-report-file:
    description: >-
      Optional JSON report path. Written from the same measurement as the
      Markdown report, so asking for both costs nothing extra.
    required: false
    default: ""
  comment-on-pr:
    description: Create or update one QueryWatt pull-request comment.
    required: false
    default: "true"
  upload-report:
    description: Upload the reports as a workflow artifact.
    required: false
    default: "true"
  fail-on-regression:
    description: >-
      Fail the job when QueryWatt returns a non-zero exit code. Set to "false"
      to keep the action successful and decide in a later step from the
      exit-code output; a failed action cannot publish outputs at all.
    required: false
    default: "true"

outputs:
  exit-code:
    description: QueryWatt exit code (0 pass, 1 regression, 2 not compared, 3 configuration).
    value: ${{ steps.verify.outputs.exit-code }}
  verdict:
    description: Human-readable verification verdict.
    value: ${{ steps.verify.outputs.verdict }}
  report-file:
    description: Path to the generated Markdown report.
    value: ${{ steps.verify.outputs.report-file }}
  json-report-file:
    description: Path to the generated JSON report, empty when none was requested.
    value: ${{ steps.verify.outputs.json-report-file }}

runs:
  using: composite
  steps:
    - name: Set up .NET
      if: ${{ inputs.setup-dotnet == 'true' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    # A failing install must not kill the action: a composite action that fails
    # publishes no outputs at all, which turns every real error into "no exit
    # code" for the caller. Failures are captured and reported instead.
    - name: Install QueryWatt tool
      id: install
      shell: bash
      env:
        QUERYWATT_PACKAGE_SOURCE: ${{ inputs.package-source }}
        QUERYWATT_TOOL_VERSION: ${{ inputs.tool-version }}
      run: |
        set -uo pipefail
        tool_path="$RUNNER_TEMP/querywatt-tools"
        install_log="$RUNNER_TEMP/querywatt-install.log"
        mkdir -p "$tool_path"

        if dotnet tool install QueryWatt \
            --tool-path "$tool_path" \
            --version "$QUERYWATT_TOOL_VERSION" \
            --add-source "$QUERYWATT_PACKAGE_SOURCE" > "$install_log" 2>&1; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
          echo "::error::Installing QueryWatt $QUERYWATT_TOOL_VERSION failed."
          cat "$install_log" >&2
        fi

        echo "tool-path=$tool_path" >> "$GITHUB_OUTPUT"
        echo "install-log=$install_log" >> "$GITHUB_OUTPUT"

    - name: Verify SQL efficiency
      id: verify
      shell: bash
      env:
        QUERYWATT_CONFIG: ${{ inputs.configuration-file }}
        QUERYWATT_REPORT: ${{ inputs.report-file }}
        QUERYWATT_JSON_REPORT: ${{ inputs.json-report-file }}
        QUERYWATT_INSTALLED: ${{ steps.install.outputs.installed }}
        QUERYWATT_TOOL_PATH: ${{ steps.install.outputs.tool-path }}
        QUERYWATT_INSTALL_LOG: ${{ steps.install.outputs.install-log }}
      run: |
        set -uo pipefail
        mkdir -p "$(dirname "$QUERYWATT_REPORT")"
        error_file="$RUNNER_TEMP/querywatt-stderr.txt"

        if [[ "$QUERYWATT_INSTALLED" != "true" ]]; then
          exit_code=3
          {
            echo "## QueryWatt verification: ERROR"
            echo
            echo "The QueryWatt tool could not be installed, so no query was measured."
            echo
            echo '```'
            tail -n 40 "$QUERYWATT_INSTALL_LOG" 2>/dev/null || echo "No install log was produced."
            echo '```'
          } > "$QUERYWATT_REPORT"
        elif [[ -n "$QUERYWATT_JSON_REPORT" ]]; then
          mkdir -p "$(dirname "$QUERYWATT_JSON_REPORT")"
          "$QUERYWATT_TOOL_PATH/querywatt" verify \
            "$QUERYWATT_CONFIG" \
            --format markdown \
            --output "json=$QUERYWATT_JSON_REPORT" \
            > "$QUERYWATT_REPORT" \
            2> "$error_file"
          exit_code=$?
        else
          "$QUERYWATT_TOOL_PATH/querywatt" verify \
            "$QUERYWATT_CONFIG" \
            --format markdown \
            > "$QUERYWATT_REPORT" \
            2> "$error_file"
          exit_code=$?
        fi

        if [[ ! -s "$QUERYWATT_REPORT" ]]; then
          {
            echo "## QueryWatt verification: ERROR"
            echo
            echo "QueryWatt exit code: $exit_code"
            echo
            echo "Error output:"
            echo
            sed 's/^/    /' "$error_file" 2>/dev/null || true
          } > "$QUERYWATT_REPORT"
        fi

        case "$exit_code" in
          0) verdict="passed" ;;
          1) verdict="regressed" ;;
          2) verdict="not-compared" ;;
          3) verdict="configuration-error" ;;
          *) verdict="unexpected-error" ;;
        esac

        # One staging directory keeps the upload step's path stable whether or
        # not a JSON report was requested.
        staging="$RUNNER_TEMP/querywatt-reports"
        rm -rf "$staging"
        mkdir -p "$staging"
        cp "$QUERYWATT_REPORT" "$staging/"
        if [[ -n "$QUERYWATT_JSON_REPORT" && -f "$QUERYWATT_JSON_REPORT" ]]; then
          cp "$QUERYWATT_JSON_REPORT" "$staging/"
        fi

        cat "$QUERYWATT_REPORT" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "report-file=$QUERYWATT_REPORT" >> "$GITHUB_OUTPUT"
        echo "json-report-file=$QUERYWATT_JSON_REPORT" >> "$GITHUB_OUTPUT"
        echo "artifact-path=$staging" >> "$GITHUB_OUTPUT"

    - name: Upload QueryWatt report
      if: ${{ inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: querywatt-report
        path: ${{ steps.verify.outputs.artifact-path }}
        if-no-files-found: error
        retention-days: 14

    - name: Create or update pull-request comment
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        QUERYWATT_ACTION_PATH: ${{ github.action_path }}
        QUERYWATT_REPORT_PATH: ${{ steps.verify.outputs.report-file }}
      with:
        script: |
          const scriptPath = `${process.env.QUERYWATT_ACTION_PATH}/.github/scripts/upsert-querywatt-comment.cjs`;
          const upsertQueryWattComment = __original_require__(scriptPath);
          await upsertQueryWattComment({
            github,
            context,
            reportPath: process.env.QUERYWATT_REPORT_PATH,
          });

    - name: Enforce QueryWatt verdict
      if: ${{ always() && inputs.fail-on-regression == 'true' }}
      shell: bash
      env:
        QUERYWATT_EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
      run: |
        if [[ "$QUERYWATT_EXIT_CODE" =~ ^[0-3]$ ]]; then
          exit "$QUERYWATT_EXIT_CODE"
        fi

        echo "QueryWatt did not produce an exit code; see the job summary." >&2
        exit 2
