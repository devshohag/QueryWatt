name: QueryWatt SQL efficiency regression guard
description: Measure SQL Server queries and fail when approved efficiency thresholds regress.
author: QueryWatt contributors

branding:
  icon: activity
  color: green

inputs:
  configuration-file:
    description: Path to querywatt.yml, relative to the repository root.
    required: false
    default: querywatt.yml
  tool-version:
    description: QueryWatt NuGet tool version to install.
    required: false
    default: 0.5.0-preview.1
  package-source:
    description: NuGet source containing the QueryWatt tool package.
    required: false
    default: https://api.nuget.org/v3/index.json
  report-file:
    description: Markdown report path, relative to the repository root.
    required: false
    default: artifacts/querywatt-report.md
  comment-on-pr:
    description: Create or update one QueryWatt pull-request comment.
    required: false
    default: "true"
  upload-report:
    description: Upload the Markdown report as a workflow artifact.
    required: false
    default: "true"

outputs:
  exit-code:
    description: QueryWatt exit code (0 pass, 1 regression, 2 measurement, 3 configuration).
    value: ${{ steps.verify.outputs.exit-code }}
  verdict:
    description: Human-readable verification verdict.
    value: ${{ steps.verify.outputs.verdict }}
  report-file:
    description: Path to the generated Markdown report.
    value: ${{ steps.verify.outputs.report-file }}

runs:
  using: composite
  steps:
    - name: Install QueryWatt tool
      shell: bash
      env:
        QUERYWATT_PACKAGE_SOURCE: ${{ inputs.package-source }}
        QUERYWATT_TOOL_VERSION: ${{ inputs.tool-version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/querywatt-tools"
        dotnet tool install QueryWatt \
          --tool-path "$RUNNER_TEMP/querywatt-tools" \
          --version "$QUERYWATT_TOOL_VERSION" \
          --add-source "$QUERYWATT_PACKAGE_SOURCE"

    - name: Verify SQL efficiency
      id: verify
      shell: bash
      env:
        QUERYWATT_CONFIG: ${{ inputs.configuration-file }}
        QUERYWATT_REPORT: ${{ inputs.report-file }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$QUERYWATT_REPORT")"
        error_file="$RUNNER_TEMP/querywatt-stderr.txt"

        set +e
        "$RUNNER_TEMP/querywatt-tools/querywatt" verify \
          "$QUERYWATT_CONFIG" \
          --format markdown \
          > "$QUERYWATT_REPORT" \
          2> "$error_file"
        exit_code=$?
        set -e

        case "$exit_code" in
          0) verdict="passed" ;;
          1) verdict="regressed" ;;
          2) verdict="measurement-error" ;;
          3) verdict="configuration-error" ;;
          *) verdict="unexpected-error" ;;
        esac

        if [[ ! -s "$QUERYWATT_REPORT" ]]; then
          {
            echo "## QueryWatt verification: ERROR"
            echo
            echo "QueryWatt exit code: $exit_code"
            echo
            echo "Error output:"
            echo
            sed 's/^/    /' "$error_file"
          } > "$QUERYWATT_REPORT"
        fi

        cat "$QUERYWATT_REPORT" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "report-file=$QUERYWATT_REPORT" >> "$GITHUB_OUTPUT"

    - name: Upload QueryWatt report
      if: ${{ inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: querywatt-report
        path: ${{ steps.verify.outputs.report-file }}
        if-no-files-found: error
        retention-days: 14

    - name: Create or update pull-request comment
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        QUERYWATT_ACTION_PATH: ${{ github.action_path }}
        QUERYWATT_REPORT_PATH: ${{ steps.verify.outputs.report-file }}
      with:
        script: |
          const scriptPath = `${process.env.QUERYWATT_ACTION_PATH}/.github/scripts/upsert-querywatt-comment.cjs`;
          const upsertQueryWattComment = __original_require__(scriptPath);
          await upsertQueryWattComment({
            github,
            context,
            reportPath: process.env.QUERYWATT_REPORT_PATH,
          });

    - name: Enforce QueryWatt verdict
      if: ${{ always() }}
      shell: bash
      env:
        QUERYWATT_EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
      run: |
        if [[ "$QUERYWATT_EXIT_CODE" =~ ^[0-3]$ ]]; then
          exit "$QUERYWATT_EXIT_CODE"
        fi

        echo "QueryWatt did not produce a valid exit code." >&2
        exit 2
